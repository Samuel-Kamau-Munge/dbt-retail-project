version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension with SCD Type 2 structure. Tracks historical customer attribute changes.
      Includes derived demographics: age, tenure, and active status flags.
    tags: ['dimension', 'customers', 'scd2']
    columns:
      - name: customer_key
        description: SCD surrogate key (md5 of customer_id + registration_date)
        tests: [unique, not_null]
      - name: customer_id
        description: Natural business key from source
        tests: [not_null]
      - name: customer_city
      - name: customer_state
      - name: customer_segment
        tests:
          - accepted_values:
              values: ['Consumer', 'Corporate', 'Home Office', 'Small Business', 'Enterprise', '']
              quote: true
              config:
                severity: warn
      - name: registration_date
      - name: customer_age
        description: Derived age in years from birth_date
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 120"
              config:
                severity: warn
      - name: tenure_days
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
      - name: is_active_flag
        description: Current SCD row is currently active (effective_end_date = 9999-12-31
        tests: [not_null, accepted_values: { values: [true, false] }]
      - name: effective_start_date
        tests: [not_null]
      - name: effective_end_date
        tests: [not_null]
      - name: dbt_scd_id
        tests: [not_null]

  - name: dim_products
    description: >
      Product dimension denormalized with supplier attributes. Includes financial
      profit margin and product volume calculations.
    tags: ['dimension', 'products']
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: product_id
        tests: [not_null]
      - name: product_category
        tests: [not_null]
      - name: supplier_id
      - name: unit_cost
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
      - name: unit_price
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
      - name: profit_margin_pct
        description: Gross margin percent = (price - cost) / price * 100
        tests:
          - dbt_utils.expression_is_true:
              expression: "<= 100"
              config:
                severity: warn
      - name: dbt_scd_id
        tests: [not_null]

  - name: dim_suppliers
    description: Supplier / vendor dimension with contract lifecycle and active status flags.
    tags: ['dimension', 'suppliers']
    columns:
      - name: supplier_key
        tests: [unique, not_null]
      - name: supplier_id
        tests: [not_null]
      - name: supplier_name
        tests: [not_null]
      - name: supplier_status
        tests:
          - accepted_values:
              values: ['Active', 'Inactive', 'Pending', 'Suspended', 'Terminated', '']
              quote: true
              config:
                severity: warn
      - name: is_active_supplier
        tests: [accepted_values: { values: [true, false] }]
      - name: dbt_scd_id
        tests: [not_null]

  - name: dim_date
    description: >
      Standard calendar date dimension. 2016-01-01 through 2030-12-31. Contains standard
      date attributes for time intelligence analysis.
    tags: ['dimension', 'date', 'utility']
    columns:
      - name: date_key
        description: Integer YYYYMMDD date key
        tests: [unique, not_null]
      - name: date_actual
        description: Actual calendar date
        tests: [unique, not_null]
      - name: year_actual
        tests: [not_null]
      - name: month_actual
        tests: [not_null]
      - name: quarter_actual
        tests: [not_null]
      - name: day_of_week
      - name: weekend_indr
        tests: [accepted_values: { values: [true, false] }]

  - name: fct_orders
    description: >
      Order header fact table. One row per order. Aggregates order-level financials
      and delivery metrics. Includes delivery KPIs like delivery_time_days and status flags.
    tags: ['fact', 'orders']
    columns:
      - name: order_key
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
              config:
                severity: warn
      - name: order_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
              config:
                severity: warn
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['created', 'approved', 'processing', 'shipped', 'delivered', 'invoiced', 'canceled', 'unavailable']
              quote: true
              config:
                severity: warn
      - name: payment_value
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
      - name: freight_value
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
      - name: total_order_value
        description: payment_value + freight_value
      - name: delivery_time_days
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
      - name: is_delivered
        tests: [accepted_values: { values: [true, false] }]
      - name: is_canceled
        tests: [accepted_values: { values: [true, false] }]

  - name: fct_order_items
    description: >
      Order line item fact table. One row per product per order. Granular pricing,
      freight, and quantity metrics at the line level.
    tags: ['fact', 'orders', 'line-items']
    columns:
      - name: order_item_key
        tests: [unique, not_null]
      - name: order_key
        tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_key
              config:
                severity: warn
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_key
              config:
                severity: warn
      - name: quantity
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
              config:
                severity: warn
      - name: price
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
      - name: line_total
        description: price * quantity
      - name: line_gross_total
        description: (price + freight_value) * quantity
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - order_item_id
            - product_id
          config:
            severity: warn

  - name: fct_inventory
    description: Inventory snapshot fact. Tracks on-hand and reserved quantities per warehouse/product.
    tags: ['fact', 'inventory']
    columns:
      - name: inventory_key
        tests: [unique, not_null]
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_key
              config:
                severity: warn
      - name: quantity_on_hand
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
      - name: quantity_reserved
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
      - name: quantity_available
        description: on_hand - reserved
      - name: is_low_stock
        tests: [accepted_values: { values: [true, false] }]
